<!doctype html>
<!-- 파일명: vote/index.html | @version 1.0.0 | 전환기 휴대폰 투표 — 칠판 QR → 학번+학생코드 → 문항 → 내기 (서버: 전환기보드 Vote.js ?api=voteinfo·votelogin·votesubmit·voteimg) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0066cc">
<title>전환기 투표</title>
<style>
:root { --bg: #f2f4f7; --card: #fff; --text: #1d1d1f; --text2: #6e6e73; --line: #e5e5ea; --blue: #0066cc; --blueBg: #eef4ff; --red: #d70015; --soft: #f5f5f7; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --card: #1b1e24; --text: #f2f2f7; --text2: #a1a1aa; --line: #2c3038; --blue: #4c9dff; --blueBg: #15233a; --red: #ff5b6b; --soft: #23272e; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.5; padding: env(safe-area-inset-top, 0px) 16px calc(env(safe-area-inset-bottom, 0px) + 96px); }
.wrap { max-width: 560px; margin: 0 auto; padding-top: 18px; }
h1 { font-size: 22px; margin: 4px 0 10px; text-wrap: balance; }
.per { background: var(--blueBg); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.per .k { color: var(--blue); font-weight: 800; }
.per b { font-variant-numeric: tabular-nums; }
.per .lf { margin-left: auto; background: var(--card); color: var(--blue); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: 13px; }
.per .lf.soon { background: var(--red); color: #fff; }
.desc { white-space: pre-line; background: var(--card); border-radius: 12px; padding: 10px 14px; margin-top: 10px; font-size: 15px; color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.card { background: var(--card); border-radius: 18px; padding: 18px 16px; margin-top: 14px; box-shadow: 0 0 0 1px var(--line); }
label { display: block; font-size: 14px; font-weight: 700; color: var(--text2); margin: 0 0 6px; }
input { width: 100%; font: inherit; font-size: 22px; font-weight: 700; letter-spacing: 2px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--soft); color: var(--text); outline: none; }
input:focus { border-color: var(--blue); background: var(--card); }
.fld + .fld { margin-top: 14px; }
.hint { font-size: 13px; color: var(--text2); margin-top: 8px; }
.msg { margin-top: 12px; font-size: 14.5px; font-weight: 700; min-height: 1em; }
.msg.bad { color: var(--red); }
.btn { font: inherit; font-size: 17px; font-weight: 800; border: none; border-radius: 999px; padding: 14px 20px; min-height: 52px; width: 100%; cursor: pointer; background: var(--soft); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
.btn.pri { background: var(--blue); color: #fff; box-shadow: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .op:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text2); margin-top: 12px; }
.who b { color: var(--text); }
.who button { margin-left: auto; font: inherit; font-size: 13px; border: none; background: none; color: var(--blue); text-decoration: underline; cursor: pointer; padding: 6px 0; }
.again { background: #fff4e0; color: #a15c00; font-weight: 800; border-radius: 10px; padding: 8px 12px; margin-top: 10px; font-size: 14px; }
.q { background: var(--card); border-radius: 18px; padding: 16px 14px; margin-top: 14px; box-shadow: 0 0 0 1px var(--line); }
.q h2 { font-size: 18px; margin: 0; text-wrap: balance; }
.q h2 small { font-size: 13px; color: var(--text2); font-weight: 600; margin-left: 6px; white-space: nowrap; }
.q .qi { display: block; max-width: 100%; max-height: 50vh; width: auto; height: auto; margin: 10px auto 0; border-radius: 12px; }
.q .qc { font-size: 13.5px; color: var(--text2); font-weight: 700; margin-top: 6px; text-align: center; }
.ops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.ops.txt { grid-template-columns: 1fr; }
.op { position: relative; font: inherit; border: none; background: var(--card); color: var(--text); border-radius: 14px; box-shadow: inset 0 0 0 2px var(--line); padding: 8px; text-align: center; font-weight: 800; font-size: 15.5px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-height: 54px; justify-content: center; }
.op img { display: block; width: auto; max-width: 100%; height: auto; max-height: 40vh; margin: 0 auto; border-radius: 10px; }
.op span { margin-top: auto; }
.op.on { box-shadow: inset 0 0 0 4px var(--blue); background: var(--blueBg); }
.op.on::after { content: '✓ 골랐어요'; position: absolute; top: 8px; left: 8px; background: var(--blue); color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.ops.txt .op.on::after { position: static; align-self: center; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); box-shadow: 0 -1px 0 var(--line); }
.bar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
.bar .cnt { font-size: 13.5px; color: var(--text2); font-weight: 700; white-space: nowrap; }
.done { text-align: center; padding: 30px 10px; }
.done .i { font-size: 54px; }
.done b { display: block; font-size: 22px; margin-top: 6px; }
.done p { color: var(--text2); font-size: 14.5px; margin: 8px 0 18px; }
.foot { text-align: center; font-size: 11px; line-height: 1.5; color: var(--text2); margin-top: 28px; }
.skel { color: var(--text2); text-align: center; padding: 40px 0; }
@media (prefers-reduced-motion: no-preference) { .op { transition: box-shadow .12s, background .12s; } }
</style>
</head>
<body>
<main class="wrap" id="app"><div class="skel">투표를 불러오는 중…</div></main>
<div class="bar" id="bar" hidden></div>
<footer class="foot" id="foot"><div>전환기 투표 · v1.0.0 · 배포 2026-11-18 09:56 (KST)</div><div>ⓒKIMJINHO</div></footer>
<script>
/* 서버 — 전환기보드 GAS(JSON API). 학생 화면은 구글 주소 밖(GitHub Pages)에 두어 구글 계정 나이 제한·계정 고르기 화면을 피한다 */
var API = 'https://script.google.com/macros/s/AKfycbxll0iA0M58l30ixnQB6bzUAmPbE6R0QAjO9KHa8m6ujkvIaA7wGmnVPWRYczbiEV3gWQ/exec';
var S = { id: '', info: null, tok: '', vote: null, who: '', a: {}, again: false, busy: false, msg: '', step: 'load', img: {} };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(name, p) {
  var q = 'api=' + name; Object.keys(p || {}).forEach(function (k) { q += '&' + k + '=' + encodeURIComponent(p[k]); });
  return fetch(API + '?' + q, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (r) { return r && r.ok && r.data !== undefined && r.data.ok !== undefined ? r.data : r; });
}
function md(s) { var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/.exec(String(s || '')); if (!m) return ''; var d = new Date(+m[1], +m[2] - 1, +m[3]); return (+m[2]) + '/' + (+m[3]) + '(' + '일월화수목금토'.charAt(d.getDay()) + ') ' + m[4]; }
function left(to) {
  var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(String(to || '')); if (!m) return null;
  var ms = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime() - Date.now(); if (ms <= 0) return { t: '마감됐어요', soon: true };
  var mi = Math.floor(ms / 60000), dd = Math.floor(mi / 1440), hh = Math.floor((mi % 1440) / 60), mm = mi % 60;
  return { t: '마감까지 ' + (dd ? dd + '일 ' + hh + '시간' : (hh ? hh + '시간 ' + mm + '분' : Math.max(1, mm) + '분')) + ' 남음', soon: ms < 3600000 };
}
function head() {
  var v = S.info; if (!v) return '';
  var L = left(v.to);
  return '<h1>🗳️ ' + esc(v.title) + '</h1><div class="per"><span class="k">🗓 투표 기간</span><b>' + esc((v.from ? md(v.from) + ' ~ ' : '~ ') + md(v.to)) + '</b>' + (L && v.state === 'live' ? '<span class="lf' + (L.soon ? ' soon' : '') + '">' + L.t + '</span>' : '') + '</div>'
    + (v.desc ? '<div class="desc">' + esc(v.desc) + '</div>' : '');
}
function imgSet(id, el) {
  if (S.img[id]) { el.src = S.img[id]; return; }
  api('voteimg', { id: id }).then(function (r) { if (r && r.ok) { S.img[id] = r.data; el.src = r.data; } }).catch(function () {});
}
function draw() {
  var app = $('app'), bar = $('bar'); bar.hidden = true;
  if (S.step === 'none') { app.innerHTML = '<div class="card" style="text-align:center"><b>' + esc(S.msg) + '</b><p class="hint">교실 칠판의 «🗳️ 투표» 화면에 있는 QR을 다시 찍어 주세요.</p></div>'; return; }
  if (S.step === 'load') { app.innerHTML = '<div class="skel">투표를 불러오는 중…</div>'; return; }
  if (S.step === 'login') {
    app.innerHTML = head() + (S.info.state !== 'live'
      ? '<div class="card" style="text-align:center"><b>' + (S.info.state === 'wait' ? '아직 투표가 열리지 않았어요' : '투표가 끝났어요') + '</b><p class="hint">' + (S.info.state === 'wait' ? md(S.info.from) + '에 열려요.' : '결과는 교실 칠판에서 볼 수 있어요.') + '</p></div>'
      : '<form class="card" id="lf" autocomplete="off"><div class="fld"><label for="sid">학번 (4자리)</label><input id="sid" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="예: 3214" autocomplete="off"></div>'
      + '<div class="fld"><label for="code">학생코드</label><input id="code" type="password" inputmode="numeric" maxlength="12" placeholder="혜원핏에 들어갈 때 쓰는 숫자" autocomplete="off"></div>'
      + '<div class="msg' + (S.msg ? ' bad' : '') + '" id="msg">' + esc(S.msg) + '</div><button type="submit" class="btn pri" id="go"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? '확인 중…' : '들어가기') + '</button>'
      + '<p class="hint">학생코드는 다른 사람에게 보여 주지 마세요. 이 화면은 저장하지 않아요.</p></form>');
    var f = $('lf'); if (!f) return;
    var sid = $('sid'); sid.value = S.sid || '';
    sid.oninput = function () { sid.value = sid.value.replace(/\D/g, '').slice(0, 4); S.sid = sid.value; if (sid.value.length === 4) $('code').focus(); };
    f.onsubmit = function (ev) { ev.preventDefault(); login($('sid').value, $('code').value); };
    if (!S.sid) setTimeout(function () { sid.focus(); }, 50);
    return;
  }
  if (S.step === 'q') {
    var v = S.vote, h = head() + '<div class="who">🙋 <b>' + esc(S.who) + '</b><button type="button" id="out">내가 아니에요</button></div>' + (S.again ? '<div class="again">이미 투표했어요 — 고쳐서 다시 낼 수 있어요</div>' : '');
    v.qs.forEach(function (q, qi) {
      var pick = S.a[q.id] || [], hasImg = q.ops.some(function (o) { return o.img; });
      h += '<section class="q"><h2>' + (qi + 1) + '. ' + esc(q.text) + '<small>' + (q.multi ? '여러 개 고르기' : '하나 고르기') + '</small></h2>'
        + (q.img ? '<img class="qi" data-img="' + esc(q.img) + '" alt="">' + (q.cap ? '<div class="qc">' + esc(q.cap) + '</div>' : '') : '')
        + '<div class="ops' + (hasImg ? '' : ' txt') + '">';
      q.ops.forEach(function (o) { h += '<button type="button" class="op' + (pick.indexOf(o.id) >= 0 ? ' on' : '') + '" data-q="' + qi + '" data-o="' + esc(o.id) + '" aria-pressed="' + (pick.indexOf(o.id) >= 0) + '">' + (o.img ? '<img data-img="' + esc(o.img) + '" alt="">' : '') + '<span>' + esc(o.text || '') + '</span></button>'; });
      h += '</div></section>';
    });
    app.innerHTML = h;
    var done = v.qs.filter(function (q) { return (S.a[q.id] || []).length; }).length;
    bar.hidden = false;
    bar.innerHTML = '<div class="in"><span class="cnt">' + done + ' / ' + v.qs.length + ' 문항</span><button type="button" class="btn pri" id="send"' + (done === v.qs.length && !S.busy ? '' : ' disabled') + '>' + (S.busy ? '내는 중…' : (done === v.qs.length ? '투표 내기' : '모든 문항을 골라 주세요')) + '</button></div>';
    Array.prototype.forEach.call(app.querySelectorAll('img[data-img]'), function (im) { imgSet(im.getAttribute('data-img'), im); });
    Array.prototype.forEach.call(app.querySelectorAll('[data-o]'), function (b) {
      b.onclick = function () {
        var q = v.qs[+b.getAttribute('data-q')], id = b.getAttribute('data-o'), cur = (S.a[q.id] || []).slice(), i = cur.indexOf(id);
        if (q.multi) { if (i >= 0) cur.splice(i, 1); else cur.push(id); } else cur = [id];
        S.a[q.id] = cur; var y = window.scrollY; draw(); window.scrollTo(0, y);
      };
    });
    $('out').onclick = function () { S.tok = ''; S.vote = null; S.a = {}; S.sid = ''; S.step = 'login'; S.msg = ''; draw(); };
    $('send').onclick = submit;
    return;
  }
  if (S.step === 'done') {
    app.innerHTML = head() + '<div class="card done"><div class="i">✅</div><b>' + (S.again ? '고쳐서 냈어요!' : '투표했어요!') + '</b><p>' + esc(S.who) + ' · 투표 기간 안에는 다시 들어와 고칠 수 있어요.<br>결과는 교실 칠판에서 볼 수 있어요.</p><button type="button" class="btn" id="re">처음 화면으로</button></div>';
    $('re').onclick = function () { S.tok = ''; S.vote = null; S.a = {}; S.sid = ''; S.step = 'login'; S.msg = ''; draw(); window.scrollTo(0, 0); };
  }
}
function login(sid, code) {
  sid = String(sid || '').replace(/\D/g, ''); code = String(code || '').replace(/\s/g, '');
  if (sid.length !== 4) { S.msg = '학번 4자리를 넣어 주세요'; draw(); return; }
  if (!code) { S.msg = '학생코드를 넣어 주세요'; S.sid = sid; draw(); $('code').focus(); return; }
  S.busy = true; S.sid = sid; S.msg = ''; draw();
  api('votelogin', { id: S.id, sid: sid, code: code }).then(function (r) {
    S.busy = false;
    if (!r || !r.ok) { S.msg = (r && r.msg) || '들어가지 못했어요'; draw(); var c = $('code'); if (c) c.focus(); return; }
    S.tok = r.token; S.vote = r.vote; S.who = r.sid + ' ' + r.name; S.a = r.prev || {}; S.again = !!r.prev; S.step = 'q'; draw(); window.scrollTo(0, 0);
  }).catch(function () { S.busy = false; S.msg = '인터넷 연결을 확인하고 다시 눌러 주세요'; draw(); });
}
function submit() {
  S.busy = true; draw();
  api('votesubmit', { token: S.tok, a: JSON.stringify(S.a) }).then(function (r) {
    S.busy = false;
    if (!r || !r.ok) { S.msg = (r && r.msg) || '내지 못했어요 — 다시 들어와 주세요'; S.step = 'login'; S.tok = ''; draw(); return; }
    S.step = 'done'; S.again = !!r.again; draw(); window.scrollTo(0, 0);
  }).catch(function () { S.busy = false; draw(); var b = $('send'); if (b) b.textContent = '연결이 끊겼어요 — 다시 누르기'; });
}
(function start() {
  S.id = (new URLSearchParams(location.search).get('v') || '').replace(/[^a-z0-9]/g, '');
  if (!S.id) { S.step = 'none'; S.msg = '어떤 투표인지 알 수 없어요'; draw(); return; }
  api('voteinfo', { id: S.id }).then(function (r) {
    if (!r || !r.ok) { S.step = 'none'; S.msg = (r && r.msg) || '투표를 찾지 못했어요'; draw(); return; }
    S.info = r.vote; document.title = r.vote.title + ' · 전환기 투표'; S.step = 'login'; draw();
  }).catch(function () { S.step = 'none'; S.msg = '인터넷 연결을 확인해 주세요'; draw(); });
  setInterval(function () { if (S.step === 'login' || S.step === 'q') { var p = document.querySelector('.per .lf'), L = S.info && left(S.info.to); if (p && L) { p.textContent = L.t; p.classList.toggle('soon', L.soon); } } }, 30000);
})();
</script>
</body>
</html>
